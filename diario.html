<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário Mental - IA Interativa</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link para o CSS externo -->
    <style>
        /* RESET GERAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilo do Body */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f7f7f7;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        /* Estilos do Cabeçalho */
        header {
            background-color: #8e44ad;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        header nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
        }

        header nav ul li a:hover {
            color: #f1f1f1;
        }

        /* Estilo do Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 60vh;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }

        .chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            max-height: 400px;
            background-color: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 15px;
            border-radius: 25px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: #8e44ad;
            color: white;
            margin-left: auto;
            font-size: 16px;
        }

        .user-message {
            background-color: #f1f1f1;
            color: #333;
            margin-right: auto;
            font-size: 16px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #user-input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            background-color: #fafafa;
        }

        #send-btn {
            padding: 12px 25px;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        #send-btn:hover {
            background-color: #7d3c96;
        }

        /* Estilo do Diário */
        .diario-container {
            margin-top: 40px;
            background-color: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .diario-container h2 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #8e44ad;
            text-align: center;
        }

        textarea#diario-input {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background-color: #fafafa;
            box-sizing: border-box;
            resize: none;
        }

        #save-btn {
            padding: 12px 25px;
            background-color: #8e44ad;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
            width: 100%;
        }

        #save-btn:hover {
            background-color: #7d3c96;
        }

        #diario-output {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .chat-container {
                margin: 20px;
                padding: 15px;
            }

            .chat-box {
                max-height: 300px;
            }

            #user-input {
                font-size: 14px;
            }

            .diario-container {
                margin: 20px;
                padding: 15px;
            }

            textarea#diario-input {
                height: 120px;
            }

            #save-btn {
                width: 100%;
            }
        }

        /* Estilo do Rodapé */
        footer {
            background-color: #8e44ad;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            margin-top: 40px;
        }

        footer a {
            color: #f1f1f1;
            text-decoration: none;
        }

        footer a:hover {
            color: #f8f8f8;
        }

        /* Música de Meditação */
        .audio-container {
            text-align: center;
            margin-top: 30px;
        }

        audio {
            width: 100%;
            max-width: 400px;
            margin: 10px auto;
        }
        /* Música de Meditação */
.audio-container {
    text-align: center;
    margin-top: 30px;
    color: #3498db; /* Alterei para um tom de azul, você pode mudar para qualquer cor */
}

.audio-container h3 {
    color: #8e44ad; /* Cor do título da música */
}

audio {
    width: 100%;
    max-width: 400px;
    margin: 10px auto;
}

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="estrutura.html">Início</a></li>
                <li><a href="diario.html">Meu Diário</a></li>
                <li><a href="ajuda.html">Ajuda</a></li>
                <li><a href="comunidade.html">Comunidade</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="chat-container">
            <div class="chat-box" id="chat-box">
                <div class="message bot-message">
                    <p>Olá! Como posso te ajudar hoje? Estou aqui para ouvir.</p>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Digite sua mensagem..." />
                <button id="send-btn">Enviar</button>
            </div>
        </div>

        <div class="diario-container">
            <h2>Seu Diário</h2>
            <textarea id="diario-input" placeholder="Escreva seus pensamentos ou sentimentos..."></textarea>
            <button id="save-btn">Salvar Diário</button>
            <div id="diario-output"></div>
        </div>

        <!-- Incorporando a música de meditação -->
        <div class="audio-container">
            <h3>Música de Meditação</h3>
            <audio controls autoplay loop>
                <source src="https://www.youtube.com/watch?v=UxhDlsH0cGU" type="audio/mp3">
                Seu navegador não suporta o elemento de áudio.
            </audio>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Diário Mental - Todos os direitos reservados.</p>
    </footer>

    <script>
        // Elementos da interface
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const diarioInput = document.getElementById('diario-input');
        const saveBtn = document.getElementById('save-btn');
        const diarioOutput = document.getElementById('diario-output');

        // Função para mostrar mensagens no chat
        function displayMessage(message, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
            messageElement.innerHTML = `<p>${message}</p>`;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;  // Rolagem para a última mensagem
        }

        // Função para processar a entrada do usuário no chat
        function processInput(input) {
            const formattedInput = input.toLowerCase().trim();
            return "Eu entendo, nem sempre é fácil falar, mas estou aqui para te ouvir. O que você gostaria de compartilhar?";
        }

        // Função para enviar a mensagem no chat
        function sendMessage() {
            const userText = userInput.value.trim();
            if (userText) {
                displayMessage(userText, 'user');
                setTimeout(() => {
                    const botResponse = processInput(userText);
                    displayMessage(botResponse, 'bot');
                }, 1000);
            }
            userInput.value = '';
        }

        // Evento de click no botão de enviar no chat
        sendBtn.addEventListener('click', sendMessage);

        // Evento de pressionar 'Enter' no campo de entrada do chat
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
